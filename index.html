<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Pull-Up Quest 12Weeks</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --accent-color: #e94560;
            --text-color: #ffffff;
            --success-color: #0fbc74;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        h1 { text-align: center; color: var(--accent-color); font-size: 24px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #8a99ad; font-size: 14px; margin-top: 0; }
        
        /* 주차 선택 및 디데이 */
        .status-box {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        select {
            background: var(--bg-color);
            color: white;
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
        }

        /* 퀘스트 카드 */
        .quest-card {
            border-left: 5px solid var(--accent-color);
            background: rgba(255,255,255,0.02);
            padding: 15px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 15px;
        }
        .quest-title { font-weight: bold; font-size: 16px; margin-bottom: 8px; color: #fff; }
        .quest-desc { font-size: 13px; color: #a0aec0; margin-bottom: 12px; }
        
        /* 세트 버튼 그리드 */
        .btn-grid { display: flex; gap: 8px; flex-wrap: wrap; }
        .set-btn {
            flex: 1;
            min-width: 60px;
            padding: 12px;
            background: #2b3b5c;
            border: none;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .set-btn.done {
            background: var(--success-color);
            box-shadow: 0 0 8px var(--success-color);
        }

        /* 팝업 축하 레이어 */
        .reward-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .reward-box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid var(--accent-color);
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .reward-box h2 { color: #ffd700; margin-top: 0; font-size: 28px; }
        .reward-box p { font-size: 16px; margin-bottom: 20px; }
        .close-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        @keyframes pop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ PULL-UP QUEST</h1>
    <p class="subtitle">일자바 맨몸 풀업을 위한 12주의 여정</p>

    <div class="status-box">
        <label for="week-select">현재 진행 주차: </label>
        <select id="week-select" onchange="changeWeek()">
            <!-- 1주차부터 12주차까지 자동 생성 -->
        </select>
    </div>

    <!-- 주차별 미션이 렌더링될 영역 -->
    <div id="quest-container"></div>
</div>

<!-- 축하 팝업 리워드 -->
<div id="reward-overlay" class="reward-overlay">
    <div class="reward-box">
        <h2>🎉 QUEST CLEAR!</h2>
        <p id="reward-text">완벽하게 1세트를 채우셨습니다!</p>
        <button class="close-btn" onclick="closeReward()">보상 수령하기</button>
    </div>
</div>

<script>
    // 12주차 전체 프로그램 데이터 구축
    const programData = {
        phase1: { // 1~4주차
            name: "1단계: 등판 기초 및 네거티브 버티기",
            quests: [
                { id: "q1", title: "🎯 네거티브 풀업 (5초 버티기)", desc: "1세트당 5회 수행 / 하루 총 4세트 짬짬이 채우기", totalSets: 4 },
                { id: "q2", title: "🦅 케틀벨 원 암 로우", desc: "1세트당 좌우 각 10~12회 / 하루 총 4세트", totalSets: 4 },
                { id: "q3", title: "✊ 데드행 (철봉 매달리기)", desc: "1세트당 전력을 다해 버티기 / 하루 총 3세트", totalSets: 3 }
            ]
        },
        phase2: { // 5~8주차
            name: "2단계: 이완과 수축의 연결",
            quests: [
                { id: "q1", title: "🚀 점프 풀업 + 네거티브 혼합", desc: "1세트당 연속 3~4회 / 하루 총 4세트", totalSets: 4 },
                { id: "q2", title: "🪵 인버티드 로우 (공원 낮은 철봉)", desc: "1세트당 8회 / 하루 총 4세트", totalSets: 4 },
                { id: "q3", title: "🏋️‍♂️ 케틀벨 더블 로우", desc: "1세트당 12kg 두 개로 6~8회 / 하루 총 3세트", totalSets: 3 }
            ]
        },
        phase3: { // 9~12주차
            name: "3단계: 일자바 맨몸 풀업 도전",
            quests: [
                { id: "q1", title: "🦅 숄더 패킹 풀업 (견갑 하강)", desc: "1세트당 8회 / 하루 총 3세트", totalSets: 3 },
                { id: "q2", title: "🎗️ 밴드 풀업", desc: "1세트당 정석 자세로 5회 / 하루 총 4세트", totalSets: 4 },
                { id: "q3", title: "👑 맨몸 풀업 1회 측정", desc: "첫 세트 실패 시 즉시 네거티브로 전환 / 하루 총 3세트", totalSets: 3 }
            ]
        }
    };

    // 응원 문구 모음
    const cheers = [
        "등 근육이 폭발하고 있습니다! 🔥",
        "올해 안에 무조건 풀업 성공각! 😎",
        "지치지 않는 코어, 멋집니다! 👍",
        "오늘의 노력이 내일의 1개를 만듭니다! 🚀",
        "완벽해요! 샤워할 때 거울 한번 보세요! 📸"
    ];

    // 주차 선택 내역 셀렉트박스 초기화
    const select = document.getElementById('week-select');
    for(let i=1; i<=12; i++) {
        let opt = document.createElement('option');
        opt.value = i;
        opt.innerHTML = `Week ${i}`;
        select.appendChild(opt);
    }

    // 로컬 스토리지에서 저장된 주차 가져오기 (기본값 1주차)
    let currentWeek = localStorage.getItem('pullup_current_week') ? parseInt(localStorage.getItem('pullup_current_week')) : 1;
    select.value = currentWeek;

    // 현재 상태 데이터 저장 구조 (LocalStorage 연동)
    let userProgress = JSON.parse(localStorage.getItem('pullup_user_progress')) || {};

    // 주차 변경 함수
    function changeWeek() {
        currentWeek = parseInt(document.getElementById('week-select').value);
        localStorage.setItem('pullup_current_week', currentWeek);
        renderQuests();
    }

    // 현재 주차에 맞는 단계(Phase) 반환 함수
    function getPhaseData(week) {
        if(week <= 4) return programData.phase1;
        if(week <= 8) return programData.phase2;
        return programData.phase3;
    }

    // 화면 그리기 (렌더링)
    function renderQuests() {
        const phase = getPhaseData(currentWeek);
        const container = document.getElementById('quest-container');
        
        let html = `<h3 style="color:#8a99ad; margin-bottom:15px; font-size:15px;">${phase.name}</h3>`;
        
        phase.quests.forEach(quest => {
            // 사용자 진행 내역 키 조합 (예: w1_q1)
            const progressKey = `w${currentWeek}_${quest.id}`;
            if (!userProgress[progressKey]) {
                userProgress[progressKey] = Array(quest.totalSets).fill(false);
            }
            
            html += `
                <div class="quest-card">
                    <div class="quest-title">${quest.title}</div>
                    <div class="quest-desc">${quest.desc}</div>
                    <div class="btn-grid">
            `;
            
            for(let setIdx=0; setIdx < quest.totalSets; setIdx++) {
                const isDone = userProgress[progressKey][setIdx];
                html += `
                    <button class="set-btn ${isDone ? 'done' : ''}" onclick="toggleSet('${progressKey}', ${setIdx})">
                        ${setIdx + 1}세트
                    </button>
                `;
            }
            
            html += `</div></div>`;
        });
        
        container.innerHTML = html;
        localStorage.setItem('pullup_user_progress', JSON.stringify(userProgress));
    }

    // 세트 완료 토글 기능
    function toggleSet(progressKey, setIdx) {
        // 이미 완료된 걸 해제할 때는 팝업 없이 상태만 변경
        const wasDone = userProgress[progressKey][setIdx];
        userProgress[progressKey][setIdx] = !wasDone;
        
        // 새로 체크(완료)했을 때만 축하 보상 팝업 발생
        if(!wasDone) {
            showReward();
        }
        
        renderQuests();
    }

    // 보상 팝업 띄우기
    function showReward() {
        const randomCheer = cheers[Math.floor(Math.random() * cheers.length)];
        document.getElementById('reward-text').innerText = randomCheer;
        document.getElementById('reward-overlay').style.display = 'flex';
    }

    // 팝업 닫기
    function closeReward() {
        document.getElementById('reward-overlay').style.display = 'none';
    }

    // 최초 실행
    renderQuests();
</script>

</body>
</html>
